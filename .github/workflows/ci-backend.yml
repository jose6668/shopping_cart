name: CI Backend

on:
  push:
    branches: [develop, qa, main]
  pull_request:
    branches: [develop, qa, main]

jobs:
  backend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        if: ${{ hashFiles('backend/pom.xml') != '' }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build backend
        if: ${{ hashFiles('backend/pom.xml') != '' }}
        working-directory: backend
        run: mvn clean compile

      - name: Run backend tests
        if: ${{ hashFiles('backend/pom.xml') != '' }}
        working-directory: backend
        run: mvn test

      - name: Skip backend build when project is not created yet
        if: ${{ hashFiles('backend/pom.xml') == '' }}
        run: echo "Backend Spring Boot project not created yet. Skipping build."
