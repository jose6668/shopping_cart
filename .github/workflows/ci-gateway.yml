name: CI Gateway

on:
  push:
    branches: [develop, qa, main]
  pull_request:
    branches: [develop, qa, main]

jobs:
  gateway-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        if: ${{ hashFiles('gateway/pom.xml') != '' }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build gateway
        if: ${{ hashFiles('gateway/pom.xml') != '' }}
        working-directory: gateway
        run: mvn clean compile

      - name: Run gateway tests
        if: ${{ hashFiles('gateway/pom.xml') != '' }}
        working-directory: gateway
        run: mvn test

      - name: Skip gateway build when project is not created yet
        if: ${{ hashFiles('gateway/pom.xml') == '' }}
        run: echo "Gateway Spring Boot project not created yet. Skipping build."
